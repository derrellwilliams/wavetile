name: Wavetile
options:
  bundleIdPrefix: com.derrellwilliams
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      # Hot reload (InjectionNext / Inject). Never applied to Release.
      OTHER_LDFLAGS: ["$(inherited)", "-Xlinker", "-interposable"]
      EMIT_FRONTEND_COMMAND_LINES: YES

packages:
  WavetileKit:
    path: Packages/WavetileKit

targets:
  Wavetile:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: WavetileKit
        product: WavetileKit
      - package: WavetileKit
        product: WidgetShared
      - target: WavetileWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derrellwilliams.wavetile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wavetile
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    entitlements:
      path: App/Wavetile.entitlements
      properties:
        com.apple.security.application-groups: [group.com.derrellwilliams.wavetile]
    info:
      path: App/Info.plist
      properties:
        # Security: allow plain HTTP only to LAN hosts (typical home Jellyfin).
        # Internet traffic must be HTTPS so the access token is never sent in cleartext.
        # Keep playing when the app is backgrounded or the screen is locked.
        UIBackgroundModes: [audio]
        # Download progress Live Activity.
        NSSupportsLiveActivities: true
        # Widget deep links (wavetile://album/<id>, wavetile://now-playing).
        CFBundleURLTypes:
          - CFBundleURLName: com.derrellwilliams.wavetile
            CFBundleURLSchemes: [wavetile]
        NSLocalNetworkUsageDescription: Wavetile connects to Jellyfin servers on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  WavetileWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: WavetileKit
        product: WidgetShared
      - package: WavetileKit
        product: DesignSystem
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derrellwilliams.wavetile.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wavetile
        MARKETING_VERSION: "0.1.0"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/WavetileWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.derrellwilliams.wavetile]

  WavetileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Wavetile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derrellwilliams.wavetile.uitests
        GENERATE_INFOPLIST_FILE: YES
        # XCTestCase overrides are nonisolated; tests opt into @MainActor individually.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: Wavetile

schemes:
  Wavetile:
    build:
      targets:
        Wavetile: all
    test:
      config: Debug
      testPlans: []
      targets:
        - WavetileUITests
    run:
      config: Debug
