name: Wavetile
options:
  bundleIdPrefix: com.derrellwilliams
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # App and widget extension must share these. scripts/testflight.sh overrides CURRENT_PROJECT_VERSION with a timestamp.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Set to your Apple Developer Team ID (developer.apple.com > Membership), then re-run xcodegen.
    DEVELOPMENT_TEAM: "88S9XG6NXK"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      # Hot reload (InjectionNext / Inject). Never applied to Release.
      OTHER_LDFLAGS: ["$(inherited)", "-Xlinker", "-interposable"]
      EMIT_FRONTEND_COMMAND_LINES: YES

packages:
  WavetileKit:
    path: Packages/WavetileKit

targets:
  Wavetile:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: WavetileKit
        product: WavetileKit
      - package: WavetileKit
        product: WidgetShared
      - target: WavetileWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derrellwilliams.wavetile
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only; XcodeGen defaults targets to "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wavetile
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
    entitlements:
      path: App/Wavetile.entitlements
      properties:
        com.apple.security.application-groups: [group.com.derrellwilliams.wavetile]
        # Granted by Apple 2026-10-30 (managed capability: enable CarPlay Audio on the App ID).
        com.apple.developer.carplay-audio: true
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Security: allow plain HTTP only to LAN hosts (typical home Jellyfin).
        # Internet traffic must be HTTPS so the access token is never sent in cleartext.
        # Keep playing when the app is backgrounded or the screen is locked; fetch lets iOS
        # wake the app to check followed podcasts for new episodes.
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.derrellwilliams.wavetile.podcast-refresh]
        # Static launch screen: the mark at rest, handed off to the animated splash in RootView.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        # Only HTTPS (exempt) encryption; skips the export compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Download progress Live Activity.
        NSSupportsLiveActivities: true
        # SwiftUI provides the phone window; CarPlay gets its own template scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        # Widget deep links (wavetile://album/<id>, wavetile://now-playing).
        CFBundleURLTypes:
          - CFBundleURLName: com.derrellwilliams.wavetile
            CFBundleURLSchemes: [wavetile]
        NSLocalNetworkUsageDescription: Wavetile connects to Jellyfin servers on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Tailscale MagicDNS names only resolve inside the user's tailnet, and WireGuard
          # encrypts the traffic, so plain HTTP to them is allowed like the LAN.
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
          # For podcast audio: some publishers still serve episodes over plain HTTP. ATS can't
          # scope this to podcasts, so it covers all AVFoundation media, Jellyfin streams included.
          # The token stays off cleartext because AuthService refuses HTTP Jellyfin servers off
          # the LAN at sign-in (and AppModel drops any such saved session).
          NSAllowsArbitraryLoadsInMedia: true

  WavetileWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: WavetileKit
        product: WidgetShared
      - package: WavetileKit
        product: DesignSystem
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derrellwilliams.wavetile.widgets
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only; XcodeGen defaults targets to "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wavetile
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/WavetileWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.derrellwilliams.wavetile]

  WavetileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Wavetile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.derrellwilliams.wavetile.uitests
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only; XcodeGen defaults targets to "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # XCTestCase overrides are nonisolated; tests opt into @MainActor individually.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: Wavetile

schemes:
  Wavetile:
    build:
      targets:
        Wavetile: all
    test:
      config: Debug
      testPlans: []
      targets:
        - WavetileUITests
    run:
      config: Debug
